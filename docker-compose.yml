services:
  db:
    image: postgres:16
    # Lê POSTGRES_DB/USER/PASSWORD do mesmo .env do backend.
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    # Aplica migrations e sobe a API. (dev server; para prod trocar por gunicorn)
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media:/app/mediafiles
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
      - media:/app/mediafiles
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  storefront:
    build:
      context: ./frontend/storefront
      args:
        # "" → o browser chama a API na mesma origem (via proxy).
        NEXT_PUBLIC_API_URL: ""
    environment:
      # SSR (dentro da rede Docker) fala direto com o backend.
      API_URL_INTERNAL: http://backend:8000
    depends_on:
      - backend

  admin:
    build:
      context: ./frontend/admin
      args:
        NEXT_PUBLIC_API_URL: ""
    environment:
      API_URL_INTERNAL: http://backend:8000
    depends_on:
      - backend

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - storefront
      - admin
      - backend

  # Produção: túnel Cloudflare (perfil "tunnel"). Não sobe no dev normal.
  # Uso: definir CLOUDFLARE_TUNNEL_TOKEN no ambiente e rodar:
  #   docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on:
      - proxy

volumes:
  postgres_data:
  media:
  caddy_data:
  caddy_config:
